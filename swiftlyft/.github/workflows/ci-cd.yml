name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/swiftlyft-backend
  NODE_VERSION: '18.x'
  FLUTTER_VERSION: '3.x'

jobs:
  frontend-lint-and-format:
    name: Frontend - Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./swiftlyft

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/swiftlyft/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('swiftlyft/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Check code formatting
        run: dart format --set-exit-if-changed .
        continue-on-error: true

  frontend-test:
    name: Frontend - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./swiftlyft

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/swiftlyft/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('swiftlyft/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test
        continue-on-error: true

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: [frontend-lint-and-format, frontend-test]
    defaults:
      run:
        working-directory: ./swiftlyft

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/swiftlyft/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('swiftlyft/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        continue-on-error: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: swiftlyft/build/app/outputs/flutter-apk/app-release.apk

  backend-lint-and-format:
    name: Backend - Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Swiftlyft_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('Swiftlyft_backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          # Try npm ci first, fallback to npm install if package-lock.json is out of sync
          npm ci || npm install

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check Prettier formatting
        run: npm run format
        continue-on-error: true

  backend-test:
    name: Backend - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Swiftlyft_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('Swiftlyft_backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          # Try npm ci first, fallback to npm install if package-lock.json is out of sync
          npm ci || npm install
          
      - name: Verify Jest installation
        run: npx jest --version || echo "Jest not found, this might cause test failures"

      - name: Run Jest tests
        run: |
          NODE_ENV=test npx jest --verbose 2>&1 | tee test-output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "::error::Tests failed with exit code $TEST_EXIT_CODE"
            echo "=== Failed test summary ==="
            grep -A 10 "FAIL\|●\|✕" test-output.log | head -50 || true
          fi
          exit $TEST_EXIT_CODE
        env:
          NODE_ENV: test

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: Swiftlyft_backend/test-output.log
        continue-on-error: true

      - name: Generate coverage report
        run: NODE_ENV=test npx jest --coverage
        continue-on-error: true
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./Swiftlyft_backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
        continue-on-error: true

  backend-api-tests:
    name: Backend - API Tests (Newman)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Swiftlyft_backend
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          # Try npm ci first, fallback to npm install if package-lock.json is out of sync
          npm ci || npm install

      - name: Install Newman
        run: npm install -g newman newman-reporter-html

      - name: Start backend server
        run: |
          # Start server in background and capture output
          echo "Starting server..."
          echo "Working directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          
          # Check if server.js exists
          if [ ! -f server.js ]; then
            echo "❌ server.js not found!"
            ls -la
            exit 1
          fi
          
          # Start server with both stdout and stderr captured
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > server.pid
          echo "Server started with PID: $SERVER_PID"
          
          # Wait a bit and check process
          sleep 3
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "❌ Server process died immediately. Checking logs..."
            echo "=========================================="
            cat server.log 2>/dev/null || echo "No server.log file found"
            echo "=========================================="
            echo "Checking for syntax errors..."
            node -c server.js || echo "Syntax check failed"
            echo "Checking if port is in use..."
            lsof -i :3000 || echo "Port 3000 seems free"
            exit 1
          fi
          
          echo "✓ Server process is running (PID: $SERVER_PID), waiting for it to be ready..."
        env:
          NODE_ENV: test
          PORT: 3000
          SERVER_START: 'true'  # Enable server to start even in test mode
          # MONGODB_URI not needed in test mode (server.js skips connection when NODE_ENV=test)
          JWT_SECRET: test-jwt-secret-key-for-ci-cd-pipeline-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci-cd-pipeline-minimum-32-chars

      - name: Wait for server
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:3000/api/health 2>/dev/null; then
              echo "✓ Server is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Server not ready yet, waiting 2 seconds..."
            sleep 2
            # Check if server process is still running
            if [ -f server.pid ]; then
              PID=$(cat server.pid)
              if ! kill -0 $PID 2>/dev/null; then
                echo "✗ Server process died. Last 50 lines of server.log:"
                tail -50 server.log || true
                exit 1
              fi
            fi
          done
          echo "✗ Server failed to start within 60 seconds"
          if [ -f server.log ]; then
            echo "Last 50 lines of server.log:"
            tail -50 server.log
          fi
          exit 1

      - name: Run Postman collection tests
        run: |
          newman run ../SwiftLyft_API_Tests_Updated.postman_collection.json \
            -e ../SwiftLyft_Environment_Updated.postman_environment.json \
            --reporters cli,html \
            --reporter-html-export newman-report.html
        continue-on-error: true

      - name: Stop backend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            PID=$(cat server.pid)
            echo "Stopping server with PID: $PID"
            kill $PID 2>/dev/null || true
            sleep 1
            kill -9 $PID 2>/dev/null || true
            rm -f server.pid
          fi
          pkill -f "node server.js" 2>/dev/null || true
          echo "Server stopped"

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            Swiftlyft_backend/server.log
            Swiftlyft_backend/server.pid
        continue-on-error: true

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: Swiftlyft_backend/newman-report.html
        if: always()

  backend-build:
    name: Backend - Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint-and-format, backend-test]
    defaults:
      run:
        working-directory: ./Swiftlyft_backend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./Swiftlyft_backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Swiftlyft_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  code-quality:
    name: Code Quality (SonarQube)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install backend dependencies
        run: |
          cd Swiftlyft_backend
          npm ci || npm install

      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  owasp-zap-scan:
    name: OWASP ZAP Security Scan (Staging)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[staging]')
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.7.0
        continue-on-error: true
        with:
          target: ${{ secrets.STAGING_API_URL || 'http://localhost:3000/api' }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: report_html.html
        if: always()

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build, security-scan, code-quality]
    if: always()

    steps:
      - name: Check quality gates
        run: |
          echo "All quality checks completed"
          echo "Frontend build: ${{ needs.frontend-build.result }}"
          echo "Backend build: ${{ needs.backend-build.result }}"
          echo "Security scan: ${{ needs.security-scan.result }}"
          echo "Code quality: ${{ needs.code-quality.result }}"

          # Fail if critical jobs failed
          if [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.backend-build.result }}" != "success" ]; then
            echo "Critical build jobs failed"
            exit 1
          fi

          echo "Quality gate passed ✅"

